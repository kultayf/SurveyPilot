[project]
name = "survey-pilot"
version = "0.1.0"
description = "Local research workspace for paper discovery, evidence review, and literature drafting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.111.0",
    "chromadb>=1.5.9",
    "fastapi>=0.116.0",
    "httpx>=0.28.0",
    "langgraph>=1.2.6",
    "openai>=2.43.0",
    "pymupdf4llm>=1.28.2,<2",
    "uvicorn>=0.35.0",
]

[project.optional-dependencies]
# 大模型解析和重排只在明确选择时安装、加载；基础安装不下载模型权重。
docling = ["docling>=2.0"]
reranker = ["sentence-transformers>=3.0"]
